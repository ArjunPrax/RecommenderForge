name: Integrity

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Data-free integrity suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install locked environment
        run: uv sync --locked

      - name: Run public-checkout test suite
        run: uv run python -m unittest discover -s tests -v

      - name: Check whitespace errors
        run: git diff --check
